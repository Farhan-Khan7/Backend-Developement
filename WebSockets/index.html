<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crimson Chat</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Remix Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <style>
      /* =========================
           GLOBAL RESET
        ========================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #080607;
        --surface: #110b0d;
        --surface-light: #1a1013;
        --crimson: #e50935;
        --crimson-light: #ff3155;
        --text: #f5eeee;
        --muted: #82777b;
        --border: rgba(255, 35, 75, 0.12);
      }

      body {
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* =========================
           BACKGROUND EFFECT
        ========================= */

      body::before {
        content: "";
        position: fixed;
        width: 550px;
        height: 550px;
        background: rgba(229, 9, 53, 0.09);
        filter: blur(150px);
        border-radius: 50%;
        top: 20%;
        left: 30%;
        pointer-events: none;
      }

      /* =========================
           MAIN CHAT CONTAINER
        ========================= */

      .chat-container {
        width: 100%;
        max-width: 1000px;
        height: 94vh;
        max-height: 850px;
        background: rgba(17, 11, 13, 0.92);
        border: 1px solid var(--border);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        box-shadow:
          0 0 50px rgba(229, 9, 53, 0.06),
          0 20px 80px rgba(0, 0, 0, 0.6);
      }

      /* =========================
           CHAT HEADER
        ========================= */

      .chat-header {
        min-height: 82px;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(28, 15, 19, 0.85);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(15px);
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7e0927, #ed1745);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        font-weight: 700;
        color: white;
        position: relative;
        box-shadow: 0 0 20px rgba(229, 9, 53, 0.25);
      }

      .online-dot {
        width: 11px;
        height: 11px;
        position: absolute;
        right: 0;
        bottom: 1px;
        background: #35d48b;
        border: 2px solid #110b0d;
        border-radius: 50%;
      }

      .user-details h2 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .user-details p {
        font-size: 11px;
        color: var(--muted);
      }

      .user-details p span {
        color: #35d48b;
      }

      .header-actions {
        display: flex;
        gap: 20px;
      }

      .header-actions i {
        font-size: 21px;
        color: #b6a8ac;
        cursor: pointer;
        transition: 0.3s;
      }

      .header-actions i:hover {
        color: var(--crimson-light);
      }

      /* =========================
           CHAT BODY
        ========================= */

      .chat-body {
        flex: 1;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
        position: relative;
        background: radial-gradient(
          ellipse at 50% 40%,
          rgba(229, 9, 53, 0.055),
          transparent 65%
        );
      }

      .chat-body::-webkit-scrollbar {
        width: 5px;
      }

      .chat-body::-webkit-scrollbar-thumb {
        background: #511020;
        border-radius: 10px;
      }

      /* DATE DIVIDER */

      .date-divider {
        align-self: center;
        padding: 6px 14px;
        font-size: 10px;
        color: #c9aeb5;
        background: #241116;
        border: 1px solid var(--border);
        border-radius: 20px;
      }

      /* EMPTY CHAT */

      .empty-chat {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        gap: 12px;
        color: var(--muted);
      }

      .empty-chat i {
        font-size: 40px;
        color: var(--crimson);
        filter: drop-shadow(0 0 15px rgba(229, 9, 53, 0.5));
      }

      .empty-chat h3 {
        color: #e8d9dd;
        font-size: 16px;
      }

      .empty-chat p {
        font-size: 12px;
      }

      /* MESSAGE BUBBLES */

      .message {
        max-width: 65%;
        width: fit-content;
        padding: 12px 15px;
        font-size: 13px;
        line-height: 1.6;
        position: relative;
        word-break: break-word;
        animation: appear 0.25s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .received {
        align-self: flex-start;
        background: #21191c;
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 15px 15px 15px 3px;
      }

      .sent {
        align-self: flex-end;
        background: linear-gradient(135deg, #8d102c, #c81038);
        border-radius: 15px 15px 3px 15px;
        box-shadow: 0 5px 20px rgba(229, 9, 53, 0.13);
      }

      .message-meta {
        display: flex;
        justify-content: flex-end;
        gap: 5px;
        align-items: center;
        margin-top: 5px;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.55);
      }

      .sent .message-meta i {
        color: #ffb2c2;
      }

      /* =========================
           CHAT FOOTER
        ========================= */

      .chat-footer {
        padding: 18px 22px;
        border-top: 1px solid var(--border);
        background: rgba(20, 12, 15, 0.95);
      }

      .input-wrapper {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 10px 14px;
        border-radius: 13px;
        background: #211619;
        border: 1px solid rgba(255, 35, 75, 0.12);
        transition: 0.3s;
      }

      .input-wrapper:focus-within {
        border-color: rgba(255, 35, 75, 0.5);
        box-shadow: 0 0 18px rgba(229, 9, 53, 0.08);
      }

      .input-wrapper > i {
        font-size: 19px;
        color: #a98b94;
        cursor: pointer;
      }

      .input-wrapper > i:hover {
        color: var(--crimson-light);
      }

      #messageInput {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: white;
        font-family: inherit;
        font-size: 12px;
      }

      #messageInput::placeholder {
        color: #88777d;
      }

      .send-button {
        width: 43px;
        height: 43px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #ed1745, #a8002b);
        color: white;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(229, 9, 53, 0.25);
        transition: 0.3s;
      }

      .send-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(229, 9, 53, 0.45);
      }

      /* =========================
           RESPONSIVE DESIGN
        ========================= */

      @media (max-width: 600px) {
        body {
          align-items: stretch;
        }

        .chat-container {
          width: 100%;
          height: 100dvh;
          max-height: none;
          border-radius: 0;
          border: none;
        }

        .chat-header {
          padding: 13px 16px;
        }

        .chat-body {
          padding: 18px 14px;
        }

        .chat-footer {
          padding: 12px;
        }

        .message {
          max-width: 82%;
        }
      }
    </style>
  </head>

  <body>
    <div class="chat-container">
      <!-- CHAT HEADER -->

      <header class="chat-header">
        <div class="user-info">
          <div class="avatar">
            F
            <span class="online-dot"></span>
          </div>

          <div class="user-details">
            <h2>Mark</h2>

            <p>
              <span>●</span>
              Online · Last seen just now
            </p>
          </div>
        </div>

        <div class="header-actions">
          <i class="ri-phone-line"></i>

          <i class="ri-vidicon-line"></i>

          <i class="ri-more-2-fill"></i>
        </div>
      </header>

      <!-- CHAT BODY -->

      <main class="chat-body" id="chatBody">
        <div class="date-divider">Today</div>

        <!-- Initially empty chat -->

        <div class="empty-chat" id="emptyChat">
          <i class="ri-chat-smile-3-line"></i>

          <h3>Start a conversation</h3>

          <p>Send a message to get things started.</p>
        </div>
      </main>

      <!-- CHAT FOOTER -->

      <footer class="chat-footer">
        <form class="input-wrapper" id="messageForm">
          <i class="ri-emotion-happy-line"></i>

          <input
            type="text"
            id="messageInput"
            placeholder="Type your message here..."
            autocomplete="off"
            required
          />

          <i class="ri-attachment-2"></i>

          <button class="send-button" type="submit">
            <i class="ri-send-plane-fill"></i>
          </button>
        </form>
      </footer>
    </div>

    <!-- JAVASCRIPT -->

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      socket.on("connect", () => {
        console.log("Connected to server");
      });

      // Select HTML elements

      const messageForm = document.getElementById("messageForm");

      const messageInput = document.getElementById("messageInput");

      const chatBody = document.getElementById("chatBody");

      const emptyChat = document.getElementById("emptyChat");

      // Listen for form submission

      // 1. SEND MESSAGE
      messageForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const messageText = messageInput.value.trim();

        // Empty message send mat karo
        if (!messageText) return;

        // Backend ko message send karo
        socket.emit("message", messageText);

        // Empty chat state remove karo
        if (emptyChat) {
          emptyChat.remove();
        }

        // Input clear karo
        messageInput.value = "";

        // Input par focus rakho
        messageInput.focus();
      });

      // 2. RECEIVE MESSAGE
      socket.on("new-message", function (new_msg) {
        // New message container
        const message = document.createElement("div");
        message.classList.add("message", "received");

        // Message text
        const text = document.createElement("div");
        text.textContent = new_msg;

        // Message metadata
        const meta = document.createElement("div");
        meta.classList.add("message-meta");

        // Current time
        const time = document.createElement("span");

        time.textContent = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        // Message tick
        const tick = document.createElement("i");
        tick.className = "ri-check-double-line";

        // Elements append karo
        meta.append(time, tick);
        message.append(text, meta);

        // Chat body mein message add karo
        chatBody.appendChild(message);

        // Latest message par scroll
        chatBody.scrollTop = chatBody.scrollHeight;
      });
    </script>
  </body>
</html>
